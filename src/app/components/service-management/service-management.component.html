<div *ngIf="loading" class="item">
  <mat-card class="service-card">
    <div class="loading-container">
      <mat-spinner diameter="50"></mat-spinner>
    </div>
  </mat-card>
</div>

<div *ngIf="!loading">
  <mat-card class="service-card">
    <mat-card-title class="service-title"> </mat-card-title>
    <mat-card-content>
      <div class="headtitle">
        <div class="back">
          <h1>Manage Services</h1>
          <mat-icon
            class="help-icon"
            matTooltip="Service represent connector it self. It contains metadata, and endpoint URL from where other connectors can communicate with it. Here you can view, edit or delete the existing service."
            aria-label="Help regarding service management"
            >help_outline</mat-icon
          >
        </div>

        <div class="buttons">
          <mat-form-field>
            <input
              matInput
              [formControl]="searchControl"
              placeholder="Search by title"
            />
          </mat-form-field>
          <button mat-button matTooltip="Add new service" (click)="onAdd()">
            <mat-icon>add</mat-icon>
          </button>
        </div>
      </div>
      <div class="space-card">
        <div *ngFor="let service of filteredDataServices" class="card-wrapper">
          <div class="card">
            <!-- Card Header -->
            <div class="card-header">
              <div class="header-left">
                <h2 class="card-title">{{ service.title }}</h2>
                <p class="card-type">{{ service.type }}</p>
              </div>
            </div>

            <!-- Card Body -->
            <div class="card-body">
              <!-- Metadata Grid -->
              <div class="metadata-grid">
                <div class="metadata-item">
                  <span class="metadata-label">ID</span>
                  <span class="metadata-value">{{ service["@id"] }}</span>
                </div>
                <div class="metadata-item">
                  <span class="metadata-label">Identifier</span>
                  <span class="metadata-value">{{ service.identifier }}</span>
                </div>
              </div>

              <!-- Endpoint URL -->
              <div class="endpoint-section">
                <div class="section-label">Endpoint URL</div>
                <div class="endpoint-value">{{ service.endpointURL }}</div>
              </div>

              <!-- Timestamps -->
              <div class="timestamps">
                <div class="timestamp-item">
                  <mat-icon>schedule</mat-icon>
                  <div class="timestamp-content">
                    <span class="timestamp-label">Issued</span>
                    <span class="timestamp-value">{{ service.issued | date : "d MMM y, HH:mm" }}</span>
                  </div>
                </div>
                <div class="timestamp-item">
                  <mat-icon>update</mat-icon>
                  <div class="timestamp-content">
                    <span class="timestamp-label">Modified</span>
                    <span class="timestamp-value">{{ service.modified | date : "d MMM y, HH:mm" }}</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Card Footer - Actions -->
            <div class="card-footer">
              <div class="btn-action">
                <button
                  mat-icon-button
                  matTooltip="View details"
                  (click)="navigateToServiceDetails(service)"
                  class="action-btn action-view"
                >
                  <mat-icon>visibility</mat-icon>
                </button>
                <button
                  mat-icon-button
                  matTooltip="Edit service"
                  (click)="onEdit(service)"
                  class="action-btn action-edit"
                >
                  <mat-icon>edit</mat-icon>
                </button>
                <button
                  mat-icon-button
                  matTooltip="Delete service"
                  (click)="onDelete(service)"
                  class="action-btn action-delete"
                >
                  <mat-icon>delete</mat-icon>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
