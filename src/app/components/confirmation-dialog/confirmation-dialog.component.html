<div class="dialog">
  <br />
  <h1 mat-dialog-title>
    {{ data.title }}
  </h1>

  <div mat-dialog-content>
    <p>{{ data.message }}</p>
  </div>
  <br />
  <div class="buttons" *ngIf="!hideActions">
    <button mat-button (click)="onCancel()">{{ cancelLabel }}</button>
    <button mat-raised-button (click)="onConfirm()" color="warn">{{ confirmLabel }}</button>
  </div>
</div>
