name: "AI Task"
description: "Implementation task optimized for Angular UI agent execution"
title: "[TASK] "
labels: ["area:UI"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for **implementation tasks** only.

        Task management stays aligned with the linked backend GitHub project dashboard, but implementation happens in this Angular UI repository. Prompts, file paths, verification steps, and examples must therefore be **UI-native**.

        After issue creation, update the title to include the shared slice tag and the issue-derived alias, for example `[TASK][X1][T107] ...`, apply the label/tag `slice:X1`, and record both values in **Source & Parent Traceability**.

  - type: textarea
    id: context
    attributes:
      label: "Context"
      placeholder: |
        **What**: ...
        **Why**: ...
        **Where**: `src/app/components/...`, `src/app/services/...`, `src/environments/...`, `.github/workflows/...`
        **Requirement source**: #... or linked dashboard issue
        **Relevant repo surfaces**: `README.md`, `USER_MANUAL.md`, `src/app/app.routes.ts`
    validations:
      required: true

  - type: textarea
    id: source-traceability
    attributes:
      label: "Source & Parent Traceability"
      placeholder: |
        **Slice tag**: `X1`
        **Issue alias**: `T107` / `B107`
        **Source type**: slice decomposition
        **Source**: #...
        **Parent / root issue**: #...
        **Dashboard of record**: linked backend GitHub repo/project
    validations:
      required: true

  - type: textarea
    id: implementation-prompt
    attributes:
      label: "Implementation Prompt"
      placeholder: |
        ## Files to modify
        - `src/app/components/...`
        - `src/app/services/...`
        - `src/app/models/...`
        - `src/app/shared/...`
        - `src/app/app.routes.ts`
        - `src/environments/...`

        ## Behavior
        - Happy path: ...
        - Error handling / empty state / loading behavior: ...
        - Route, dialog, or form behavior: ...

        ## Patterns to follow
        - Reuse existing services/models/shared utilities
        - Keep endpoints in environment helpers or services
        - Follow the existing standalone-component style

        ## Tests to update
        - `src/app/.../*.spec.ts`
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      placeholder: |
        Relates to: #
        Depends on: #
        Blocked by: #
    validations:
      required: false

  - type: textarea
    id: ui-impact
    attributes:
      label: "UI Route / Flow Impact"
      placeholder: |
        **Routes touched**: ...
        **Screens / dialogs / forms touched**: ...
        **connectorA / connectorB impact**: none / connectorA / connectorB / both
        **Workflow or CI impact**: none / `.github/workflows/...`
    validations:
      required: false

  - type: textarea
    id: security-quality
    attributes:
      label: "Security & Quality Requirements"
      placeholder: |
        - Input handling / unsafe HTML considerations ...
        - Auth / interceptor / header behavior ...
        - Environment or endpoint handling constraints ...
    validations:
      required: false

  - type: textarea
    id: parallelization
    attributes:
      label: "Delivery Stream & Parallelization"
      placeholder: |
        **Stream**: `catalog-ui` / `management-ui` / `shared-services` / `workflow-ci`
        **Can run in parallel with**: #..., #...
        **Must wait for**: #... or `None`
        **Why this is independently executable**: ...
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: "Type"
      options:
        - feature
        - enhancement
        - bug
        - refactor
        - docs
        - test
        - chore
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - "P0 — blocker"
        - "P1 — high"
        - "P2 — medium"
        - "P3 — low"
    validations:
      required: true

  - type: dropdown
    id: milestone
    attributes:
      label: "Milestone"
      options:
        - "Next release"
        - "Future release"
        - "Maintenance / hotfix"
    validations:
      required: true

  - type: dropdown
    id: ai-model
    attributes:
      label: "AI Model"
      options:
        - "Sonnet 4.6 (standard implementation)"
        - "Opus 4.8 (complex, multi-file, architectural)"
        - "Fable 5 (most capable — cross-module or workflow-critical work)"
        - "Haiku 4.5 (simple, mechanical changes)"
    validations:
      required: true

  - type: dropdown
    id: agent-mode
    attributes:
      label: "Agent Mode"
      options:
        - "Single agent — sequential execution"
        - "Parallel agents — independent sub-tasks"
        - "Human-assisted — agent implements, human validates interactively"
    validations:
      required: true

  - type: textarea
    id: agent-instructions
    attributes:
      label: "Agent Instructions"
      placeholder: |
        **Read first**: `AGENTS.md`, `README.md`, `USER_MANUAL.md`, `src/app/app.routes.ts`, relevant component/service/spec files
        **Constraints**: use UI repo commands and files only
    validations:
      required: false

  - type: textarea
    id: verification
    attributes:
      label: "Verification Checklist"
      placeholder: |
        **Build**
        - [ ] `npm run build` exits 0

        **Automated tests**
        - [ ] `npm test -- --watch=false --browsers=ChromeHeadless` exits 0
        - [ ] Targeted spec coverage updated for changed behavior

        **UI behavior**
        - [ ] Changed route / screen / dialog / form behavior matches the prompt
        - [ ] [manual] Browser walkthrough completed if visible behavior changed

        **Environment / workflow**
        - [ ] connectorA / connectorB behavior verified if relevant
        - [ ] Workflow change validated against the touched `.github/workflows/...` file if relevant
    validations:
      required: true
