name: "Documentation Task (slice-level)"
description: "Slice-level documentation task for Angular UI work"
title: "[DOCS] "
labels: ["area:UI"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for **slice-level documentation tasks** produced by task decomposition.

        The task-management process stays aligned with the linked backend project dashboard, but documentation updates must target the real docs in this UI repository.

  - type: textarea
    id: context
    attributes:
      label: "Context"
      placeholder: |
        **Slice**: #...
        **What was implemented**: ...
        **Why this doc work matters**: ...
        **Primary doc surfaces**: `README.md`, `USER_MANUAL.md`, `CHANGELOG.md`, `release_notes.md`
    validations:
      required: true

  - type: textarea
    id: source-traceability
    attributes:
      label: "Source & Parent Traceability"
      placeholder: |
        **Slice tag**: `X1`
        **Issue alias**: `T107` / `B107`
        **Parent slice**: #...
        **Sibling implementation tasks shipped**: #..., #...
        **Gating QA task**: #...
        **Dashboard of record**: linked backend GitHub repo/project
    validations:
      required: true

  - type: textarea
    id: documentation-scope
    attributes:
      label: "Documentation scope"
      placeholder: |
        **What changed in the UI**:
        - ...

        **Authoritative docs to update**:
        - `README.md` — setup/contributor notes
        - `USER_MANUAL.md` — runtime/operator guidance
        - `CHANGELOG.md` — externally meaningful behavior change
        - `release_notes.md` — release-facing notes if applicable

        **Out of scope here**:
        - product code not required for doc-only work
    validations:
      required: true

  - type: textarea
    id: ui-changes
    attributes:
      label: "UI / integration changes register"
      placeholder: |
        | Surface | Change | Authoritative doc & section |
        |---|---|---|
        | Route / screen / dialog / config / workflow | ... | `README.md` / `USER_MANUAL.md` / `release_notes.md` |
    validations:
      required: true

  - type: textarea
    id: learnings
    attributes:
      label: "What was learned"
      placeholder: |
        - Reusable UI or workflow pattern ...
        - Setup or environment gotcha ...
        - CI / release behavior note ...
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      placeholder: |
        Relates to: #... (parent slice)
        Depends on: #... (impl task A)
        Depends on: #... (impl task B)
        Depends on: #... (QA task)
    validations:
      required: true

  - type: textarea
    id: parallelization
    attributes:
      label: "Delivery Stream & Parallelization"
      placeholder: |
        **Stream**: `ui-docs`
        **Can run in parallel with**: docs tasks of unrelated slices
        **Must wait for**: all sibling implementation tasks + QA task
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: "Type"
      options:
        - docs
        - feature
        - enhancement
        - bug
        - refactor
        - test
        - chore
      default: 0
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - "P0 — blocker"
        - "P1 — high"
        - "P2 — medium"
        - "P3 — low"
    validations:
      required: true

  - type: dropdown
    id: milestone
    attributes:
      label: "Milestone"
      options:
        - "Next release"
        - "Future release"
        - "Maintenance / hotfix"
    validations:
      required: true

  - type: dropdown
    id: ai-model
    attributes:
      label: "AI Model"
      options:
        - "Sonnet 4.6 (standard implementation)"
        - "Opus 4.8 (complex, multi-file, architectural)"
        - "Fable 5 (most capable — cross-module or workflow-critical work)"
        - "Haiku 4.5 (simple, mechanical changes)"
    validations:
      required: true

  - type: dropdown
    id: agent-mode
    attributes:
      label: "Agent Mode"
      options:
        - "Single agent — sequential execution"
        - "Parallel agents — independent sub-tasks"
        - "Human-assisted — agent executes, human validates interactively"
    validations:
      required: true

  - type: textarea
    id: agent-instructions
    attributes:
      label: "Agent Instructions"
      placeholder: |
        **Read first**: parent slice, merged implementation work, QA outcome
        **Constraints**: use real UI repo docs only
    validations:
      required: false

  - type: textarea
    id: verification
    attributes:
      label: "Verification Checklist"
      placeholder: |
        **Docs updated**
        - [ ] `README.md` updated where applicable
        - [ ] `USER_MANUAL.md` updated where applicable
        - [ ] `CHANGELOG.md` updated when externally meaningful
        - [ ] `release_notes.md` updated when release-facing behavior changed

        **Register coverage**
        - [ ] Every UI / integration change row appears in the correct doc section

        **Scope**
        - [ ] No product-code-only work was added to this docs task
    validations:
      required: true
