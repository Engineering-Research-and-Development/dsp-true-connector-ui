{{- if .Values.minio.enabled -}}
{{- $ns := default .Release.Namespace .Values.minio.namespace -}}
{{- $secretName := tpl .Values.minio.credentials.secretName . -}}
{{- $existing := lookup "v1" "Secret" $ns $secretName -}}
{{- if not $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.minio.credentials.accessKey | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.credentials.secretKey | quote }}
{{- end }}
{{- end }}
