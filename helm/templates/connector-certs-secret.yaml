{{- if and .Values.connector.certsSecret.enabled (or .Values.connector.certsSecret.keystoreJksB64 .Values.connector.certsSecret.truststoreJksB64) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-certs" (include "tc.fullname" .)) .Values.connector.certsSecret.name }}
  namespace: {{ .Values.global.namespace }}
type: Opaque
data:
  {{- if .Values.connector.certsSecret.keystoreJksB64 }}
  true-connector-keystore.jks: {{ .Values.connector.certsSecret.keystoreJksB64 }}
  {{- end }}
  {{- if .Values.connector.certsSecret.truststoreJksB64 }}
  true-connector-truststore.jks: {{ .Values.connector.certsSecret.truststoreJksB64 }}
  {{- end }}
{{- end }}
